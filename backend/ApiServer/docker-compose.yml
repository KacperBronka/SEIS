services:
  seis-backend:
    build: .
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "2000:80"
    environment:
      PORT: 80
      HOST: 0.0.0.0
      DB_HOST: mariadb
      DB_PORT: 3307
      DB_USER: seis
      DB_PASSWORD: seis_password
      DB_DATABASE: seis

  mariadb:
    image: mariadb:11.4
    command: ["--port=3307"]
    ports:
      - "3307:3307"
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: seis
      MARIADB_USER: seis
      MARIADB_PASSWORD: seis_password
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -P 3307 -u seis -pseis_password --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data: